<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBF7EF">
<title>AI윤리 플래시카드 · 핵심 100장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg, #FBF7EF 0%, #F5EFE1 100%);
    color: #1a2942;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 24px 20px 80px; }

  /* Header */
  header { margin-bottom: 24px; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  h1 {
    font-size: 26px; font-weight: 700; color: #1a2942;
    letter-spacing: -0.02em; margin: 0;
    font-family: 'Noto Serif KR', serif;
  }
  .subtitle { font-size: 13px; color: #78716c; margin-top: 4px; }
  .btn-shortcut {
    background: transparent; border: 1px solid #d6d3d1; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; color: #57534e; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    font-family: inherit;
  }
  .btn-shortcut:hover { background: #fff; }
  .shortcuts {
    margin-top: 12px; background: #fff; border: 1px solid #e7e5e4;
    border-radius: 8px; padding: 12px 14px; font-size: 12px; color: #44403c;
    display: none; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 6px;
  }
  .shortcuts.visible { display: grid; }
  kbd {
    display: inline-block; padding: 1px 5px;
    background: #f5f5f4; border: 1px solid #d6d3d1;
    border-radius: 3px; font-size: 11px;
    font-family: monospace; color: #44403c;
  }

  /* Chapter filter */
  .chapters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip {
    background: #fff; color: #44403c;
    border: 1px solid #d6d3d1; border-radius: 999px;
    padding: 6px 14px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; font-family: inherit;
  }
  .chip:hover { border-color: #a8a29e; }
  .chip.active { background: #1a2942; color: #fff; border-color: #1a2942; }

  /* Stats bar */
  .stats {
    background: #fff; border: 1px solid #e7e5e4;
    border-radius: 12px; padding: 14px 18px; margin-bottom: 20px;
  }
  .stats-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .stats-label {
    font-size: 12px; color: #78716c; font-weight: 500;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .stats-count {
    font-size: 13px; color: #1a2942; font-weight: 600;
    display: flex; align-items: center; gap: 4px;
  }
  .progress-bar { width: 100%; height: 6px; background: #f5f5f4; border-radius: 999px; overflow: hidden; }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #c2410c, #ea580c);
    transition: width 0.4s; border-radius: 999px;
  }

  /* Controls */
  .controls {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; gap: 8px; flex-wrap: wrap;
  }
  .control-group { display: flex; gap: 6px; }
  .btn-icon {
    background: #fff; color: #44403c;
    border: 1px solid #d6d3d1; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; font-weight: 500;
    cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    font-family: inherit;
  }
  .btn-icon.active { background: #1a2942; color: #fff; border-color: #1a2942; }
  .counter { font-size: 13px; color: #78716c; font-weight: 500; }

  /* Card */
  .card-container { perspective: 1200px; margin-bottom: 16px; }
  .card {
    position: relative; width: 100%; min-height: 380px;
    cursor: pointer; transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; top: 0; left: 0;
    width: 100%; min-height: 380px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 16px; padding: 24px;
    display: flex; flex-direction: column;
    box-shadow: 0 4px 24px -8px rgba(26, 41, 66, 0.15), 0 2px 6px -2px rgba(26, 41, 66, 0.08);
  }
  .card-front { background: #fffdf9; border: 1px solid #e7e5e4; }
  .card-back {
    background: #1a2942; color: #fffdf9;
    transform: rotateY(180deg); border: 1px solid #1a2942;
  }
  .card-top { display: flex; justify-content: space-between; align-items: start; margin-bottom: 16px; }
  .badge {
    background: #f5f5f4; color: #44403c;
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
    border: 1px solid #e7e5e4;
  }
  .card-back .badge {
    background: #2a3a55; color: #fbbf77; border-color: #3a4a65;
  }
  .badge-mastered {
    background: #dcfce7; color: #15803d;
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .card-back .badge-mastered { background: #166534; color: #bbf7d0; }
  .card-body-front {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 16px 8px;
  }
  .card-body-front .text {
    font-size: 22px; font-weight: 600; color: #1a2942;
    text-align: center; line-height: 1.5;
    white-space: pre-line; font-family: 'Noto Serif KR', serif;
    letter-spacing: -0.01em;
  }
  .card-body-back {
    flex: 1; display: flex; align-items: center;
    padding: 16px 8px;
  }
  .card-body-back .text {
    font-size: 15px; color: #fffdf9;
    white-space: pre-line; line-height: 1.75;
    letter-spacing: -0.005em; width: 100%;
  }
  .card-footer {
    text-align: center; font-size: 11px; color: #a8a29e;
    margin-top: 12px; letter-spacing: 0.1em; text-transform: uppercase;
  }

  /* Navigation */
  .nav-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .btn-nav {
    background: #fff; color: #1a2942;
    border: 1px solid #d6d3d1; border-radius: 10px;
    padding: 14px 16px; font-size: 14px; font-weight: 600;
    cursor: pointer; flex: 1;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; transition: all 0.15s; font-family: inherit;
  }
  .btn-nav:hover { border-color: #1a2942; }
  .btn-nav.primary {
    background: #c2410c; color: #fff; border: none; flex: 2;
  }
  .btn-nav.primary:hover { background: #9a3412; }
  .btn-nav.mastered {
    background: #15803d; color: #fff; border: none; flex: 2;
  }

  /* Empty */
  .empty {
    background: #fff; border: 2px dashed #e7e5e4;
    border-radius: 16px; padding: 80px 24px; text-align: center;
    color: #78716c;
  }
  .empty p { font-size: 15px; margin: 0 0 16px; }

  /* Tiny progress */
  .mini-progress {
    width: 100%; height: 3px; background: #f5f5f4;
    border-radius: 999px; overflow: hidden; margin-bottom: 24px;
  }
  .mini-fill { height: 100%; background: #1a2942; transition: width 0.3s; }

  /* Footer */
  .footer {
    text-align: center; color: #a8a29e; font-size: 11px;
    margin-top: 32px; padding-top: 20px; border-top: 1px solid #e7e5e4;
  }
  .btn-reset {
    background: transparent; border: none; color: #a8a29e;
    font-size: 11px; cursor: pointer; text-decoration: underline;
    padding: 4px; font-family: inherit;
  }

  /* Icons (simple inline SVG via CSS) */
  .icon { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .icon-lg { width: 18px; height: 18px; stroke-width: 2.25; }

  @media (max-width: 480px) {
    .container { padding: 16px 14px 80px; }
    h1 { font-size: 22px; }
    .card-body-front .text { font-size: 19px; }
    .card-body-back .text { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-row">
      <div>
        <h1>AI윤리 플래시카드</h1>
        <div class="subtitle">핵심 100장 · 시험 대비 엄선</div>
      </div>
      <button class="btn-shortcut" onclick="toggleShortcuts()">
        <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/></svg>
        단축키
      </button>
    </div>
    <div class="shortcuts" id="shortcuts">
      <div><kbd>Space</kbd> 카드 뒤집기</div>
      <div><kbd>←</kbd> / <kbd>→</kbd> 이전 / 다음</div>
      <div><kbd>M</kbd> 외웠음 체크</div>
      <div><kbd>S</kbd> 섞기 / 원래 순서</div>
    </div>
  </header>

  <div class="chapters" id="chapters"></div>

  <div class="stats">
    <div class="stats-row">
      <div class="stats-label" id="stats-label">전체 진도</div>
      <div class="stats-count">
        <svg class="icon" viewBox="0 0 24 24" style="color: #c2410c;"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        <span id="stats-count">0 / 100</span>
      </div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="chapter-progress" style="width: 0%"></div>
    </div>
  </div>

  <div class="controls">
    <div class="control-group">
      <button class="btn-icon" id="btn-shuffle" onclick="toggleShuffle()">
        <svg class="icon" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        <span id="shuffle-label">섞기</span>
      </button>
      <button class="btn-icon" id="btn-hide" onclick="toggleHideMastered()">
        <svg class="icon" id="eye-icon" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="hide-label">전체 보기</span>
      </button>
    </div>
    <div class="counter" id="counter">1 / 100</div>
  </div>

  <div id="card-area"></div>

  <div class="nav-row" id="nav-row">
    <button class="btn-nav" onclick="goPrev()">
      <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      이전
    </button>
    <button class="btn-nav primary" id="btn-master" onclick="toggleMastered()">
      <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      <span id="master-label">외웠음</span>
    </button>
    <button class="btn-nav" onclick="goNext()">
      다음
      <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <div class="mini-progress"><div class="mini-fill" id="mini-fill" style="width: 0%"></div></div>

  <div class="footer">
    <button class="btn-reset" onclick="resetProgress()">전체 진도 초기화</button>
    <span style="margin: 0 8px;">·</span>
    전체 <span id="total-count">100</span>장 · 외운 것 <span id="mastered-count">0</span>장
  </div>
</div>

<script>
// ============ CARDS DATA ============
const CARDS = [
  // 1단원 (15장)
  {id:1,ch:1,front:"정보사회의 5대 탈(脫)특성",back:"① 탈시·공간성\n② 탈신체성\n③ 탈일방성\n④ 탈언어성\n⑤ 탈인격성\n\n⚠️ '탈윤리성'은 포함되지 않음!"},
  {id:2,ch:1,front:"지능정보사회 5대 문제\n(암기: 개·디·자·허·알)",back:"개 — 개인정보 보호 문제\n디 — 디지털 불평등\n자 — 자동화 실업\n허 — 허위정보 (딥페이크)\n알 — 알고리즘 편향·불투명성"},
  {id:3,ch:1,front:"Risky Technology란?",back:"사용을 피할 수 없어 위험을 감수해야 하는 기술\n\n⚠️ 번역 주의:\n'위험한 기술' (×)\n→ '위험을 무릅쓸 수밖에 없는 기술' (○)\n\n예: 장기이식, AI"},
  {id:4,ch:1,front:"윤리 · 도덕 · 관습 · 법의 차이",back:"• 윤리 = 자율성 + 이성 동반\n• 도덕 = 인간이 지켜야 할 도리\n• 관습 = 문화·지역별 상이, 규제력 없음\n• 법 = 강제성 + 질서유지 + 고비용"},
  {id:5,ch:1,front:"사전예방 vs 사후처방",back:"• 사전예방 = 규범윤리 이론 도입\n  → 허용 기준 제시\n\n• 사후처방 = 사례 분석\n  → 책임 규명, 제도 개선\n\n⚠️ 순서 바꾸지 말 것!"},
  {id:6,ch:1,front:"인류사 4대 혁명과 핵심 기술",back:"• 신석기 혁명 → 농업\n• 1차 산업혁명 → 증기기관\n• 2차 산업혁명 → 전기·대량생산\n• 3차 산업혁명 → 컴퓨터\n• 4차 산업혁명 → 인공지능 (AI)"},
  {id:7,ch:1,front:"지능정보사회 4대 구성요소",back:"① IoT (사물인터넷)\n② 빅데이터\n③ AI (인공지능)\n④ 클라우드\n\n+ 학습모델 추론·예측\n+ 산업 간 경계 사라짐 (융합)"},
  {id:8,ch:1,front:"데이터의 역할 (비유)",back:"데이터 = 지능정보사회의 '석유(기름)'\n\n산업혁명 시대 석유가 원동력이었듯,\n지능정보사회에서 데이터는 핵심 자원\n\n정보 > 에너지 > 물질"},
  {id:9,ch:1,front:"J. 롤즈의 '반성적 평형'",back:"Risky Technology 판단을 위한 도구\n\n직관과 윤리 이론을 조정하는 개념\n(reflective equilibrium)"},
  {id:10,ch:1,front:"사회 패러다임 변화\n— 주도 인력",back:"• 농업사회 → 농부\n• 공업사회 → 공장노동자\n• 정보사회 → 정보노동자\n• 지능정보사회 → 지식노동자"},
  {id:11,ch:1,front:"정보 가치의 역전",back:"지능정보사회 가치 순서:\n\n정보 > 에너지 > 물질\n\n(과거 산업사회: 물질 > 에너지 > 정보)"},
  {id:12,ch:1,front:"★ 교수님 해석:\n'AI를 잘 쓴다'의 의미",back:"= 편안함을 가능하게 하는 사용\n\nAI를 개발한 이유 = 편하려고\n편안하지 않게 되면 = 잘 못 쓰는 것\n\n→ 인간의 삶을 윤택하게 하는 도구"},
  {id:13,ch:1,front:"알고리즘 편향이\n윤리 문제인 이유",back:"책임 소재가 불명확해지기 때문\n\n→ 개발자? 설계자? 사용자?\n누구에게 책임이 있는지 결정 불가\n\n∴ 윤리학이 개입 필요"},
  {id:14,ch:1,front:"강(强) AI의 본질\n(교수님 해석)",back:"= '나랑 구분할 수 없는 놈'\n\n튜링 테스트적 AI는 윤리적이어야 가능\n→ 담배, 쓰레기도 처리 필요\n→ 윤리 모듈 필수\n\n⚠️ 과거 AI = 계산기 (IQ)\n현재 AI = 구분 불가한 인격체"},
  {id:15,ch:1,front:"정보사회 정의",back:"'탈공업화 사회'\n\n정보의 수입·생산·제작·가공·저장 과정을\n컴퓨터와 통신기술의 발달로\n확산시키는 사회"},

  // 2단원 (20장)
  {id:16,ch:2,front:"philosophy의 어원",back:"philos (φίλος) = 사랑\n+\nsophia (σοφία) = 지혜\n\n= '지혜를 사랑하는 학문'"},
  {id:17,ch:2,front:"deon / deontic의 어원",back:"그리스어 deon (δέον) = 의무\n\n'마땅히 해야 할 것'\ndeontic 이론 = 의무 이론\n(= 비결과주의)"},
  {id:18,ch:2,front:"meta의 어원",back:"'~을 넘어서 (beyond)' 의미\n\n메타윤리학 = 윤리 판단을 '넘어서'\n도덕 언어·추론의 의미를 분석"},
  {id:19,ch:2,front:"윤리학의 3대 분과",back:"① 규범 윤리학 (처방)\n   - 윤리 이론 + 응용 윤리\n\n② 메타 윤리학 (언어 분석)\n\n③ 기술 윤리학 (서술)\n   - 인류학·사회학자 연구"},
  {id:20,ch:2,front:"성품 중심 vs 행위 중심",back:"• 성품 중심 = 다원론 (덕 여러 개)\n  → 덕윤리\n\n• 행위 중심 = 일원론 (기준 하나)\n  → 공리주의, 칸트 의무론\n\n⚠️ 로스 = 비결과주의 + 다원론 (예외!)"},
  {id:21,ch:2,front:"결과주의 vs 비결과주의",back:"• 결과주의 (teleological)\n  → 행위의 결과로 판단\n  예: 공리주의\n\n• 비결과주의 (deontological)\n  → 동기·내면으로 판단\n  예: 칸트, 로스"},
  {id:22,ch:2,front:"가치 이론 vs 의무 이론",back:"• 가치 이론 (value theory)\n  - 선/악 평가 활동\n  - good / bad\n\n• 의무 이론 (deontic theory)\n  - 마땅히 해야 할 것\n  - right / wrong"},
  {id:23,ch:2,front:"★★★ 40% 틀리는 함정:\n'옳다/좋다' 서술 순서",back:"• 결과주의:\n  'A는 옳은 행위' (왜? 좋기 때문)\n\n• 비결과주의:\n  'A는 좋은 행위' (왜? 옳기 때문)\n\n⚠️ 순서 반대로 쓰면 감점!\n시험 확정 출제 포인트"},
  {id:24,ch:2,front:"★ 교수님 강조:\n'good' 번역 주의",back:"good/bad ≠ '선하다/악하다'\n\n정확한 번역:\n'좋다' / '가치 있다' (value)\n\n윤리학 = 가치 이론 (value theory)\n\n⚠️ 답안에 '선한 행위' 쓰면 감점!"},
  {id:25,ch:2,front:"결과주의의 대표 예시",back:"'물에 빠진 많은 사람을\n구하는 행위는 옳다'\n\n왜? 많은 사람 구함 → 좋은 결과 → 가치 있음"},
  {id:26,ch:2,front:"비결과주의의 대표 예시",back:"'노인의 무거운 짐을\n들어주는 행위는 좋다'\n\n왜? 인간의 도리(의무)이기 때문\n→ 짐 떨어뜨려도 좋은 행위 (동기 중시)"},
  {id:27,ch:2,front:"공리주의의 4가지 특성",back:"① 결과주의\n② 목적론적 (teleological)\n③ 일원론 (기준 = 행복의 양)\n④ 행위 중심"},
  {id:28,ch:2,front:"덕윤리의 4가지 특성",back:"① 비결과주의\n② 목적론적 (덕 → 목표 달성)\n③ 다원론 (덕이 여러 개)\n④ 성품(행위자) 중심"},
  {id:29,ch:2,front:"칸트 의무론의 4가지 특성",back:"① 비결과주의\n② 법칙론적 (deontological)\n③ 일원론 (기준 = 선의지)\n④ 행위 중심"},
  {id:30,ch:2,front:"로스 의무론의 특징 (예외!)",back:"• 비결과주의 (동기 중시)\n• 다원론 (7가지 일견적 의무)\n\n⚠️ 비결과주의인데 다원론인\n유일한 이론!"},
  {id:31,ch:2,front:"응용 윤리학의 예",back:"• 의료 윤리\n• 환경 윤리\n• 직업 윤리\n• AI 윤리\n• 생명 윤리\n\n⚠️ 메타 윤리는 응용 아님!"},
  {id:32,ch:2,front:"윤리적 가치의 4가지 특징",back:"① 사회적·개인적 중요성\n② 의도적 권위 (위에서 강요 X)\n③ 보편화 (이성적 존재 모두)\n④ 이성 기반\n\n⚠️ '강제적 적용'은 포함 X"},
  {id:33,ch:2,front:"★ 교수님 해석:\n윤리학 = ?",back:"윤리학 = '믿음 체계'\n\n공리주의자 → 공리주의를 '믿음'\n덕윤리자 → 덕윤리를 '믿음'\n\n진리가 아닌 믿음\n→ 서로 다른 이론 공존 가능"},
  {id:34,ch:2,front:"기술 윤리학\n(descriptive ethics)이란?",back:"사람들이 실제로 무엇을 믿어왔는가를\n서술하는 학문\n\n주로 인류학자·사회학자가 연구\n\n⚠️ '과학기술 윤리' 아님!"},
  {id:35,ch:2,front:"메타윤리학의 4가지 특성",back:"① '~을 넘어서' 의미\n② 도덕 언어의 의미 분석\n③ 구체 판단 X\n④ 도덕 추론의 정당성 검토\n\n예: 윤리 상대주의, 윤리 절대주의"},

  // 3단원 (15장)
  {id:36,ch:3,front:"윤리(ethics)의 어원",back:"ethos (ἔθος) = 습관\n\n→ '습관적 행동'에서 유래\n→ 보편성 강조"},
  {id:37,ch:3,front:"도덕(moral)의 어원",back:"mores = 습속 / 관습\n\n→ 라틴어 '관습'에서 유래\n→ 상대성 강조\n\n⚠️ 오늘날엔 윤리·도덕 동의어"},
  {id:38,ch:3,front:"문화 상대주의의 6주장\n(암기: 서·한·객·특·보·관)",back:"서 — 서로 다른 사회 = 다른 도덕률\n한 — 한 사회 도덕률이 옳고그름 결정\n객 — 객관적 기준으로 우열 판단 불가\n특 — 도덕률은 특정 사회 내에서만\n보 — 보편 도덕률 존재 부정\n관 — 관용이 필요한 덕목"},
  {id:39,ch:3,front:"★ 문화 차이성 논증의 오류",back:"전제: 사람들의 '믿음'이 다르다\n결론: 실제 '진리'가 없다\n\n⚠️ 전제(믿음) ↛ 결론(진리)\n범주가 달라 도출 불가!\n\n예: '지구가 평평'이라 믿어도\n실제 진리(지구 둥굶)는 변치 않음"},
  {id:40,ch:3,front:"윤리 상대주의 수용 시\n3가지 결과 + 반례",back:"① 다른 사회 관습을 열등하다 못함\n   ↔ 노예제도\n② 자기 사회 관습 비판 못함\n   ↔ 인종차별 분리 정책\n③ 도덕적 진보 개념 의문\n   ↔ 여성 지위 변화"},
  {id:41,ch:3,front:"상대주의에서 얻는 2가지 교훈",back:"① 독단주의 경고\n   (자기 도덕 = 절대 진리 착각 방지)\n\n② 개방적 태도\n   (다른 문화에 열린 마음)"},
  {id:42,ch:3,front:"W. 섬너(Sumner)는?",back:"문화 상대주의를 대표하는 학자\n\n주장: '관습은 전통으로서의 권위를 갖기에\n분석의 대상이 될 수 없다'"},
  {id:43,ch:3,front:"윤리 절대주의란?",back:"윤리 보편주의의 극단 형태\n\n인간 본성·상황과 무관하게\n도덕률이 절대적\n\n→ 수학·물리학처럼 확정적"},
  {id:44,ch:3,front:"문화 중립적 판단 기준",back:"윤리 보편주의의 제안:\n\n특정 풍습이 영향을 받는 사람들의\n'복지(welfare)'를\n증진/감퇴시키는가?"},
  {id:45,ch:3,front:"헤로도토스 일화",back:"다리우스 왕의 비교:\n• 그리스인 → 조상 시체 화장\n• 칼라티아에족 → 조상 시체 식용\n\n서로의 관습을 기괴하다 여김\n→ 문화 상대주의의 고전 일화"},
  {id:46,ch:3,front:"★★★ 교수님 강조:\n관용(tolerance)의 올바른 이해",back:"관용 = 수평적 관계에서 서로 수용\n\n⚠️ '관용을 베풀다' (×)\n'베풀다' = 수직 관계 (위→아래) 전제\n\n수평 관계 = A ↔ B 동등\n→ 상호 수용이 진정한 관용"},
  {id:47,ch:3,front:"보편 도덕률의 예",back:"모든 존속 가능한 사회의\n보편 도덕률:\n\n① 살인 금지\n② 거짓말 금지\n\n→ 없으면 사회 존속 불가"},
  {id:48,ch:3,front:"믿음의 차이 ≠ 진리의 부재",back:"예: A가 '지구 평평'이라 믿어도\n실제 진리는 변치 않음\n\n→ 문화 차이성 논증의 핵심 오류\n\n대부분의 문화 차이 = 믿음의 차이\n(가치 기준의 차이 아님)"},
  {id:49,ch:3,front:"메타윤리학에 속하는 이론",back:"• 윤리 상대주의\n• 윤리 보편주의\n• 윤리 절대주의\n• 도덕 실재론 / 반실재론\n\n⚠️ 공리주의, 덕윤리 = 규범윤리\n(메타 X)"},
  {id:50,ch:3,front:"교수님 해석:\n메타윤리학 = 무엇의 논리?",back:"= '변호사의 논리'\n\n표면 너머(meta)\n의도·정당성 판단\n\n예: 살인 A(고의) vs B(정당방위)\n물리 결과 같아도 → 처벌 다름\n→ 메타적 판단"},

  // 4단원 (25장)
  {id:51,ch:4,front:"소크라테스 — '무지의 지'",back:"자신이 모른다는 것을 안다는 인식\n\n→ 진정한 앎의 출발점\n\n⚠️ '너 자신을 알라'는 실제로\n델포이 신전에 새겨진 문구!"},
  {id:52,ch:4,front:"소크라테스 — 문답법",back:"그리스어: dialektike (디알렉티케)\n\n질문과 대답을 통해\n상대방이 스스로 진리를 깨닫게 하는 방법"},
  {id:53,ch:4,front:"소크라테스 — 산파술",back:"대화(문답)를 통해\n진리를 '낳게' 도와주는 방법\n\n어원: matrix (자궁)\n→ 영화 《매트릭스》의 어원도 여기서!\n\n소크라테스 = 조력자 (닥터 아님)"},
  {id:54,ch:4,front:"소크라테스 vs 소피스트",back:"• 소피스트:\n  답을 직접 가르침\n  + 수업비 (한 달 월급)\n\n• 소크라테스:\n  질문만 함, 답은 스스로 찾게\n  + 무료"},
  {id:55,ch:4,front:"플라톤 — 4주덕",back:"① 지혜 (sophia)\n② 용기 (andreia)\n③ 절제 (sōphrosynē)\n④ 정의 (dikaiosynē)\n\n※ 정의 = 세 덕의 '조화'"},
  {id:56,ch:4,front:"플라톤 — 영혼 삼분설과 덕",back:"• 이성적 부분 → 지혜\n• 기개(감정)적 부분 → 용기\n• 욕구적 부분 → 절제\n\n세 부분의 조화 = 정의"},
  {id:57,ch:4,front:"플라톤 — 동굴의 비유",back:"해결하려 한 두 문제:\n\n① 가치론적 문제\n   (무엇이 좋은가?)\n② 형이상학적 문제\n   (무엇이 실재인가?)\n\n→ 이데아론으로 답"},
  {id:58,ch:4,front:"플라톤 — 아카데미아",back:"플라톤이 세운 학교 이름\n\n⚠️ 리케이온 (×)\n리케이온 = 아리스토텔레스의 학교"},
  {id:59,ch:4,front:"★★★ 플라톤 = 주지주의 (主知主義)",back:"한자: 知 (알 지)\n\n지식을 '소유하기만 하면'\n옳은 행위가 가능하다는 입장\n\n= 알면 행동한다"},
  {id:60,ch:4,front:"플라톤 도덕 철학의 한계",back:"유덕한 사람도 잘못된 행위 가능성\n\n→ 사전에 덕 있는 사람이 누군지\n   설명 불가\n→ 이상적·비현실적"},
  {id:61,ch:4,front:"아리스토텔레스 — 행복의 2성질",back:"eudaimonia (에우다이모니아)\n\n① 최종성 (finality)\n② 완전성 (self-sufficiency)\n\n⚠️ '최고성·지속성' 아님!"},
  {id:62,ch:4,front:"아리스토텔레스 — 탁월성 2종",back:"① 성격적 탁월성\n   → 습관(hexis)으로 형성\n\n② 지적 탁월성\n   → 가르침과 경험·시간으로 형성"},
  {id:63,ch:4,front:"★ 아리스토텔레스 — 중용",back:"지나침과 모자름 사이의 중간\n\n⚠️ 산술적 평균 아님!\n\n'우리와의 관계에서의 중간'\n→ 상황·관계에 따라 다름\n\n예: 초등학생 담배 → 가서 훈계 = 용기\n고등학생 담배 → 경찰 신고 = 중용"},
  {id:64,ch:4,front:"아리스토텔레스 — phronesis",back:"phronesis (프로네시스)\n= 실천적 지혜\n\n중용을 '상황에 맞게' 적용하는 능력\n\n⚠️ sophia (지혜)와 다름\nsophia = 보편적·이론적 지혜"},
  {id:65,ch:4,front:"아리스토텔레스 — 리케이온",back:"아리스토텔레스가 세운 학교 이름\n\n돌아다니며 가르쳐서\n'소요학파(peripatetic)'라 불림\n\n⚠️ 아카데미아 (×) — 플라톤의 학교"},
  {id:66,ch:4,front:"★★★ 아리스토텔레스 = 주의주의 (主意主義)",back:"한자: 意 (뜻 의)\n\n앎만으론 부족\n→ 하려고 하는 '의지(will)'가 필요\n\n= 알아도 의지 없으면 행동 X\n(예: 관악산 가면 좋은 걸 알지만 안 감)"},
  {id:67,ch:4,front:"아리스토텔레스 — 3가지 활동 기능",back:"① 영양·생식 기능 (식물)\n② 감각·욕구 기능 (동물)\n③ 이성·사유 기능 (인간만)\n\n→ 인간 고유의 기능 = 이성"},
  {id:68,ch:4,front:"아리스토텔레스 — 관조적 삶",back:"인간의 이성·사유 기능을\n발현하는 삶\n\n= 행복한 삶\n\ntheoria (테오리아) = 관조"},
  {id:69,ch:4,front:"★ 라파엘로 '아테네 학당'\n플라톤 vs 아리스토텔레스 구별법",back:"① 나이 (플라톤 = 흰 수염)\n\n② 손바닥 방향\n   플라톤 = 하늘 (이데아)\n   아리스토텔레스 = 땅 (현상)\n\n③ 들고 있는 책\n   플라톤 = 《티마이오스》\n   아리스토텔레스 = 《에티카》"},
  {id:70,ch:4,front:"아리스토텔레스 — 행복 공식",back:"이성 → 중용 → 지속 → 습관 → 덕 → 행복\n\n(덕스러운 행위를 반복\n → 습관 → 덕 → 행복)"},
  {id:71,ch:4,front:"성격적 vs 지적 탁월성 형성",back:"• 성격적 탁월성 → 습관 (hexis)\n  예: 용기, 절제\n\n• 지적 탁월성 → 가르침·경험·시간\n  예: sophia, phronesis"},
  {id:72,ch:4,front:"덕의 형성 원리\n(교수님 논문 연결)",back:"덕은 타고나지 않음\n\n반복된 행위 → 습관 → 성품 → 덕\n\n※ 교수님 2022년 논문:\n이 구조 = 딥러닝 학습 과정\n→ 덕윤리 AI 탑재 가능!"},
  {id:73,ch:4,front:"주지주의 vs 주의주의 한자",back:"• 주지주의 主知主義 → 플라톤\n  知 = 알 지 (앎 강조)\n\n• 주의주의 主意主義 → 아리스토텔레스\n  意 = 뜻 의 (의지 강조)\n\n※ 17세기 이후 '의지(will)' 개념 등장"},
  {id:74,ch:4,front:"phronesis vs sophia",back:"• sophia = 보편적·이론적 지혜\n\n• phronesis = 실천적·상황적 지혜\n  → 중용을 상황에 맞게 적용\n  → 유덕한 사람만 판단 가능"},
  {id:75,ch:4,front:"화이트헤드의 명언",back:"'플라톤 이후의 모든 철학은\n플라톤 철학의 주석이다'\n\n교수님 해석:\n'철학은 플라톤에서 끝났다'"},

  // 5단원 (25장)
  {id:76,ch:5,front:"공리주의의 슬로건",back:"'최대 다수의 최대 행복'\n\n(greatest happiness\nof the greatest number)"},
  {id:77,ch:5,front:"★ '공리(utility)' 번역 주의",back:"정확한 의미: 공공선 / 공동선\n(common good)\n\n⚠️ 주의:\n• 효율성(efficiency) (×) → 경제학\n• 유용성 (△) → 부정확\n\n예: Utility Bill = 공공요금"},
  {id:78,ch:5,front:"양적 공리주의 — 벤덤",back:"J. Bentham\n\n쾌락·고통을 '양'으로 계산\n모든 쾌락은 동등\n\n비판: '돼지의 철학'"},
  {id:79,ch:5,front:"질적 공리주의 — 밀",back:"J. S. Mill\n\n쾌락의 '질' 차이 인정\n고급 쾌락 > 저급 쾌락\n\n예: 지적 쾌락 > 감각적 쾌락"},
  {id:80,ch:5,front:"밀의 질적 공리주의 명언",back:"'배부른 돼지보다\n배고픈 소크라테스가 낫다'\n\n※ 실제로는 두 문장이 합쳐진 통설\n(원문엔 이 합성 문장 없음)"},
  {id:81,ch:5,front:"행위 공리주의",back:"'개별' 행위의 결과로 판단\n\n비판: 무고한 사람 죽여도\n옳은 행위가 될 수 있음 (극단 사례)"},
  {id:82,ch:5,front:"규칙 공리주의",back:"'모든' 사람이 그 규칙을\n따랐을 때의 결과로 판단\n\n예: '민간인 살해 금지' 규칙\n\n비판: 수단이 목적이 될 수 있음"},
  {id:83,ch:5,front:"★★★ 40% 틀림:\n행위 vs 규칙 공리주의",back:"키워드: '개별 vs 모든'\n\n⚠️ 답안에 '개별', '모든' 반드시 포함!\n\n• 행위 = '개별' 행위의 결과\n• 규칙 = '모든' 사람 적용 시 결과"},
  {id:84,ch:5,front:"공리주의의 문제점",back:"① 행위 공리: 무고한 희생 가능\n② 규칙 공리: 원래 목적 포기 가능\n③ 행복 측정 어려움\n④ 소수자 권리 무시 가능"},
  {id:85,ch:5,front:"칸트 — 선의지 (Good Will)",back:"도덕의 근원\n\n선의지 = 의무를 따르려는\n순수 이성의 의지\n\n결과와 무관, 동기만 봄"},
  {id:86,ch:5,front:"가언 명법\n(hypothetical imperative)",back:"'If ~ then ~' 형식의 조건부 명령\n\n예: '행복하고 싶다면 정직해라'\n→ 수단적 도덕\n(칸트는 이를 거부)"},
  {id:87,ch:5,front:"정언 명법\n(categorical imperative)",back:"무조건적·절대적 명령\n\n예: '거짓말 하지 말라' (그냥)\n\n특징:\n• 무조건\n• 의무·책임 자체\n• 목적 그 자체"},
  {id:88,ch:5,front:"★★★ with duty vs because of duty",back:"• '의무와 일치' (with duty):\n  도덕적 가치 없음\n\n• '의무이기 때문에' (because of duty):\n  도덕적 가치 있음 ✓\n\n⚠️ 칸트는 동기 = 의무 그 자체만 인정"},
  {id:89,ch:5,front:"칸트 의무론의 문제점",back:"① 순수 이성만으론 판단 불가\n   (fMRI로 감정 뇌 작동 증명)\n② 선의의 거짓말도 반대\n   → 비합리적 결과\n③ 이성적 판단끼리 충돌\n④ 감정·선호 배제 불가"},
  {id:90,ch:5,front:"★ '당위 능력 함축'\n(Ought Implies Can)",back:"'해라(ought)'는\n'할 수 있음(can)'을 전제\n\n능력 없는 것에 '해라' 요구 불가\n\n예: 다리 없는 사람에게 '뛰어라' (×)\n\n⚠️ PPT에 없지만 시험 가능성 높음"},
  {id:91,ch:5,front:"로스의 '일견적 의무'\n(prima facie)",back:"prima facie = 'at a glance'\n(언뜻 보기에)\n\n⚠️ 책 번역 '조건적 의무' (부정확)\n\n교수님 번역:\n'얼핏 보기에 해야 하는 의무'"},
  {id:92,ch:5,front:"★★★ 로스의 7가지 일견적 의무\n(암기: 신·보·공·선·감·해·자)",back:"신 — 신의 (fidelity)\n보 — 보상 (reparation)\n공 — 공정 (justice)\n선 — 선행 (beneficence)\n감 — 감사 (gratitude)\n해 — 해악금지 (non-maleficence)\n자 — 자기개발 (self-improvement)"},
  {id:93,ch:5,front:"일견적 의무 vs 실제 의무",back:"• 일견적 (prima facie):\n  언뜻 봐서 해야 할 의무\n\n• 실제 (actual):\n  구체 상황에서 결정되는 의무\n\n※ 일견적 의무 ≠ 반드시 실제 의무"},
  {id:94,ch:5,front:"로스 의무론의 문제점",back:"일견적 의무 간 충돌 시\n조정 방법 없음\n\n예: 신의 vs 공정 상충\n→ 어느 것을 우선?\n→ 도덕적 직관에 맡김 (모호)"},
  {id:95,ch:5,front:"AI 윤리 모듈 3가지",back:"① 하향식 (top-down)\n   → 공리주의, 칸트\n② 상향식 (bottom-up)\n   → 덕윤리, 로스\n③ 하이브리드\n   → 교수님 권장"},
  {id:96,ch:5,front:"하향식(top-down) AI 윤리 모듈",back:"= 행위 중심 = 일원론\n→ 공리주의, 칸트 의무론\n\n규칙을 '위에서' 설계해 탑재\n\n※ 교수님 3년 연구 → 실패 (C등급)\n이유: 철학자·공학자 언어 불일치"},
  {id:97,ch:5,front:"상향식(bottom-up) AI 윤리 모듈",back:"= 성품 중심 = 다원론\n→ 덕윤리, 로스 의무론\n\n경험·데이터에서 '아래에서' 학습\n\n※ 딥러닝 구조와 일치\n교수님 2022년 논문 = 성공!"},
  {id:98,ch:5,front:"★ 하이브리드 윤리 모듈의 핵심",back:"★ '사용자 선택권 보장'\n\n① 상향식(덕) → 기본 답변\n② 역전파로 사용자 선택 윤리 검증\n③ 사용자가 결과 수용 책임\n\n※ 교수님 권장 순서: 상향 → 하향\n\n예: 차 브레이크 고장 시\n칸트 or 공리주의 선택 필요"},
  {id:99,ch:5,front:"★★★ 자율권 vs 자동화",back:"• automation (자동화)\n  → 똑같이 복제 (보드마카 복제)\n  → 다르면 불량품\n\n• autonomy (자율권)\n  → 창의적 제작 OK\n  → 속성(기능)만 유지하면 됨\n\n※ 진짜 AI = 자율권 필요\n→ 윤리 모듈 필수"},
  {id:100,ch:5,front:"칸트 vs 공리주의 비교",back:"• 공리주의:\n  결과주의 + 일원론\n  기준: 행복의 양\n\n• 칸트 의무론:\n  비결과주의 + 일원론\n  기준: 의무 (선의지)\n\n• 공통: 둘 다 '행위 중심'\n→ AI 하향식 탑재 이론"},
];

const CHAPTERS = [
  { id: 'all', short: '전체' },
  { id: 1, short: '1단원' },
  { id: 2, short: '2단원' },
  { id: 3, short: '3단원' },
  { id: 4, short: '4단원' },
  { id: 5, short: '5단원' },
];

const CHAPTER_LABELS = {
  all: '전체 진도',
  1: '1단원 · AI윤리',
  2: '2단원 · 윤리학',
  3: '3단원 · 메타윤리',
  4: '4단원 · 덕윤리',
  5: '5단원 · 공리/의무',
};

const STORAGE_KEY = 'ai-ethics-flashcard-v1';

// ============ STATE ============
let state = {
  chapter: 'all',
  order: null,
  index: 0,
  flipped: false,
  mastered: {},
  hideMastered: false,
};

// Load saved state
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    const data = JSON.parse(saved);
    if (data.mastered) state.mastered = data.mastered;
  }
} catch(e) {}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ mastered: state.mastered }));
  } catch(e) {}
}

function getActiveCards() {
  let cards = state.chapter === 'all' ? CARDS : CARDS.filter(c => c.ch === state.chapter);
  if (state.hideMastered) cards = cards.filter(c => !state.mastered[c.id]);
  if (state.order) {
    const idSet = new Set(cards.map(c => c.id));
    cards = state.order.map(id => CARDS.find(c => c.id === id)).filter(c => c && idSet.has(c.id));
  }
  return cards;
}

// ============ RENDER ============
function renderChapters() {
  const container = document.getElementById('chapters');
  container.innerHTML = '';
  CHAPTERS.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (state.chapter === ch.id ? ' active' : '');
    btn.textContent = ch.short;
    btn.onclick = () => {
      state.chapter = ch.id;
      state.index = 0;
      state.flipped = false;
      state.order = null;
      render();
    };
    container.appendChild(btn);
  });
}

function renderCard() {
  const cards = getActiveCards();
  const area = document.getElementById('card-area');
  const navRow = document.getElementById('nav-row');
  const miniProgress = document.querySelector('.mini-progress');

  if (cards.length === 0) {
    area.innerHTML = `
      <div class="empty">
        <p>${state.hideMastered ? '모든 카드를 외우셨어요! 🎉' : '해당 단원에 카드가 없습니다'}</p>
        ${state.hideMastered ? '<button class="btn-nav primary" style="max-width:200px;margin:0 auto;display:inline-flex;" onclick="disableHideMastered()">전체 보기</button>' : ''}
      </div>`;
    navRow.style.display = 'none';
    miniProgress.style.display = 'none';
    document.getElementById('counter').textContent = '0 / 0';
    return;
  }
  navRow.style.display = 'flex';
  miniProgress.style.display = 'block';

  if (state.index >= cards.length) state.index = 0;
  const card = cards[state.index];
  const chapterShort = CHAPTERS.find(c => c.id === card.ch).short;
  const isMastered = !!state.mastered[card.id];

  area.innerHTML = `
    <div class="card-container">
      <div class="card ${state.flipped ? 'flipped' : ''}" id="card-el">
        <div class="card-face card-front">
          <div class="card-top">
            <span class="badge">${chapterShort}</span>
            ${isMastered ? '<span class="badge-mastered"><svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>외움</span>' : ''}
          </div>
          <div class="card-body-front">
            <div class="text"></div>
          </div>
          <div class="card-footer">탭 또는 스페이스 → 답 보기</div>
        </div>
        <div class="card-face card-back">
          <div class="card-top">
            <span class="badge">${chapterShort}</span>
            ${isMastered ? '<span class="badge-mastered"><svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>외움</span>' : ''}
          </div>
          <div class="card-body-back">
            <div class="text"></div>
          </div>
          <div class="card-footer">탭하여 뒤집기</div>
        </div>
      </div>
    </div>`;

  // Set text via textContent to avoid HTML injection
  area.querySelector('.card-body-front .text').textContent = card.front;
  area.querySelector('.card-body-back .text').textContent = card.back;

  document.getElementById('card-el').onclick = () => {
    state.flipped = !state.flipped;
    document.getElementById('card-el').classList.toggle('flipped');
  };

  // Update counter & master button
  document.getElementById('counter').textContent = `${state.index + 1} / ${cards.length}`;
  const masterBtn = document.getElementById('btn-master');
  const masterLabel = document.getElementById('master-label');
  if (isMastered) {
    masterBtn.classList.remove('primary');
    masterBtn.classList.add('mastered');
    masterLabel.textContent = '외움 해제';
  } else {
    masterBtn.classList.remove('mastered');
    masterBtn.classList.add('primary');
    masterLabel.textContent = '외웠음';
  }

  // Mini progress
  const miniProgressEl = document.getElementById('mini-fill');
  miniProgressEl.style.width = `${((state.index + 1) / cards.length) * 100}%`;
}

function renderStats() {
  const chapterCards = state.chapter === 'all' ? CARDS : CARDS.filter(c => c.ch === state.chapter);
  const masteredInChapter = chapterCards.filter(c => state.mastered[c.id]).length;
  const totalInChapter = chapterCards.length;
  const totalMastered = Object.values(state.mastered).filter(v => v).length;

  document.getElementById('stats-label').textContent = CHAPTER_LABELS[state.chapter];
  document.getElementById('stats-count').textContent = `${masteredInChapter} / ${totalInChapter}`;
  document.getElementById('chapter-progress').style.width = `${totalInChapter > 0 ? (masteredInChapter / totalInChapter) * 100 : 0}%`;
  document.getElementById('mastered-count').textContent = totalMastered;
  document.getElementById('total-count').textContent = CARDS.length;

  // Shuffle button state
  const shuffleBtn = document.getElementById('btn-shuffle');
  const shuffleLabel = document.getElementById('shuffle-label');
  if (state.order) {
    shuffleBtn.classList.add('active');
    shuffleLabel.textContent = '원래 순서';
  } else {
    shuffleBtn.classList.remove('active');
    shuffleLabel.textContent = '섞기';
  }

  // Hide button state
  const hideBtn = document.getElementById('btn-hide');
  const hideLabel = document.getElementById('hide-label');
  const eyeIcon = document.getElementById('eye-icon');
  if (state.hideMastered) {
    hideBtn.classList.add('active');
    hideLabel.textContent = '완료 숨김';
    eyeIcon.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>';
  } else {
    hideBtn.classList.remove('active');
    hideLabel.textContent = '전체 보기';
    eyeIcon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function render() {
  renderChapters();
  renderStats();
  renderCard();
}

// ============ ACTIONS ============
function goNext() {
  const cards = getActiveCards();
  if (cards.length === 0) return;
  state.flipped = false;
  state.index = (state.index + 1) % cards.length;
  render();
}

function goPrev() {
  const cards = getActiveCards();
  if (cards.length === 0) return;
  state.flipped = false;
  state.index = (state.index - 1 + cards.length) % cards.length;
  render();
}

function toggleMastered() {
  const cards = getActiveCards();
  if (cards.length === 0) return;
  const card = cards[state.index];
  state.mastered[card.id] = !state.mastered[card.id];
  save();
  render();
}

function toggleShuffle() {
  if (state.order) {
    state.order = null;
  } else {
    const pool = (state.chapter === 'all' ? CARDS : CARDS.filter(c => c.ch === state.chapter))
      .filter(c => !state.hideMastered || !state.mastered[c.id])
      .map(c => c.id);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    state.order = pool;
  }
  state.index = 0;
  state.flipped = false;
  render();
}

function toggleHideMastered() {
  state.hideMastered = !state.hideMastered;
  state.index = 0;
  state.flipped = false;
  state.order = null;
  render();
}

function disableHideMastered() {
  state.hideMastered = false;
  render();
}

function toggleShortcuts() {
  document.getElementById('shortcuts').classList.toggle('visible');
}

function resetProgress() {
  if (confirm('모든 암기 진도를 초기화할까요?')) {
    state.mastered = {};
    save();
    render();
  }
}

// ============ KEYBOARD ============
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    state.flipped = !state.flipped;
    const el = document.getElementById('card-el');
    if (el) el.classList.toggle('flipped');
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    goNext();
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    goPrev();
  } else if (e.key.toLowerCase() === 'm') {
    e.preventDefault();
    toggleMastered();
  } else if (e.key.toLowerCase() === 's') {
    e.preventDefault();
    toggleShuffle();
  } else if (e.key === '?') {
    e.preventDefault();
    toggleShortcuts();
  }
});

// Initial render
render();
</script>
